<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Elas Mathearbeit – 4. Klasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --ink: #1b2a4a;
    --ink-2: #2f4570;
    --paper: #fbf7ee;
    --paper-2: #f3ecda;
    --grid-line: rgba(27, 42, 74, 0.09);
    --gold: #c8930f;
    --gold-light: #f0c86e;
    --gold-bg: #fff6df;
    --success: #2f9e44;
    --success-bg: #e6f7e9;
    --error: #d6433c;
    --error-bg: #fdeceb;
    --card: #ffffff;
    --card-border: rgba(27, 42, 74, 0.12);
    --shadow: 0 8px 24px rgba(27, 42, 74, 0.10);
    --font-display: "Lexend", sans-serif;
    --font-mono: "Space Mono", monospace;
    --font-hand: "Caveat", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--font-display);
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 18px 16px 40px; }

  header.top {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 4px 18px;
  }
  .star-badge {
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; box-shadow: var(--shadow); flex-shrink: 0;
  }
  header.top h1 { font-size: 22px; margin: 0; font-weight: 800; color: var(--ink); }
  header.top p { margin: 2px 0 0; font-family: var(--font-hand); font-size: 19px; color: var(--ink-2); }
  .chaos-toggle-btn {
    margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 13px;
    padding: 9px 15px; border-radius: 999px; border: 2px solid var(--card-border);
    background: var(--card); color: var(--ink-2); cursor: pointer; white-space: nowrap;
    transition: all .15s ease; align-self: center;
  }
  .chaos-toggle-btn.active { background: var(--error); border-color: var(--error); color: #fff; }
  @media (max-width: 560px) { .chaos-toggle-btn { margin-left: 0; } header.top { flex-wrap: wrap; } }

  nav.tabs {
    display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap;
  }
  nav.tabs button {
    font-family: var(--font-display); font-weight: 600; font-size: 14.5px;
    padding: 10px 16px; border-radius: 999px; border: 2px solid var(--card-border);
    background: var(--card); color: var(--ink-2); cursor: pointer;
    transition: all .15s ease;
  }
  nav.tabs button.active {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  nav.tabs button:hover:not(.active) { border-color: var(--gold); }

  .group-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-2); font-weight: 700; margin: 26px 2px 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .group-title:first-child { margin-top: 4px; }
  .group-title .bar { flex: 1; height: 1px; background: var(--card-border); }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .cat-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
    display: flex; flex-direction: column; gap: 6px; position: relative;
  }
  .cat-card:hover { transform: translateY(-2px); border-color: var(--gold); }
  .cat-card .icon-row { display: flex; align-items: center; justify-content: space-between; }
  .cat-card .icon { font-size: 26px; }
  .cat-card h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .cat-card p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
  .cat-card .weak-flag {
    font-size: 11px; font-weight: 700; color: var(--error);
    background: var(--error-bg); padding: 2px 8px; border-radius: 999px;
  }
  .progress-bar { height: 6px; border-radius: 4px; background: var(--paper-2); overflow: hidden; margin-top: 4px; }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .mastery-star { position: absolute; top: 10px; right: 14px; font-size: 18px; }

  .practice-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap;
  }
  .back-btn {
    background: none; border: none; color: var(--ink-2); font-family: var(--font-display);
    font-weight: 600; cursor: pointer; font-size: 14px; padding: 6px 0;
  }
  .streak {
    font-family: var(--font-mono); font-weight: 700; font-size: 14px;
    background: var(--gold-bg); color: var(--gold); padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--gold-light);
  }

  .task-card {
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    border: 1px solid var(--card-border); padding: 26px 24px; margin-bottom: 18px;
  }
  .task-prompt { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 18px; }
  .equation { font-family: var(--font-mono); font-size: 30px; font-weight: 700; text-align: center; margin: 10px 0 20px; letter-spacing: 1px; }

  input[type="number"], input[type="text"] {
    font-family: var(--font-mono); font-size: 20px; padding: 10px 14px;
    border: 2px solid var(--card-border); border-radius: 10px; width: 150px;
    background: var(--paper); color: var(--ink); text-align: center;
  }
  input[type="number"]::placeholder, input[type="text"]::placeholder { font-size: 15px; }
  input[type="number"]:focus, input[type="text"]:focus { outline: none; border-color: var(--gold); }
  .input-row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
  .input-row label { font-size: 13px; color: var(--ink-2); display: block; margin-bottom: 4px; font-weight: 600; }

  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
    padding: 12px 22px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--ink); color: var(--paper); transition: transform .1s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.secondary { background: var(--paper-2); color: var(--ink); border: 1px solid var(--card-border); }
  .btn.gold { background: var(--gold); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

  .feedback { text-align: center; font-weight: 700; font-size: 16px; padding: 12px; border-radius: 12px; margin-top: 14px; }
  .feedback.correct { background: var(--success-bg); color: var(--success); }
  .feedback.wrong { background: var(--error-bg); color: var(--error); }
  .feedback .explain { font-weight: 500; font-size: 14px; margin-top: 6px; color: var(--ink-2); }

  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 17px;
    padding: 8px 14px; border-radius: 10px; background: var(--paper-2);
    border: 2px solid var(--card-border); cursor: pointer; margin: 4px;
  }
  .chip.used { opacity: .35; cursor: default; }
  .chip.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip-row { display: flex; flex-wrap: wrap; justify-content: center; }
  .answer-strip {
    min-height: 46px; display: flex; align-items: center; justify-content: center;
    gap: 8px; margin: 14px 0; flex-wrap: wrap;
  }
  .answer-strip .slot {
    font-family: var(--font-mono); font-weight: 700; font-size: 15px;
    min-width: 60px; padding: 8px 10px; border-radius: 8px; background: var(--gold-bg);
    border: 2px dashed var(--gold-light); text-align: center; color: var(--gold);
  }

  .thze-table { margin: 0 auto 18px; border-collapse: collapse; font-family: var(--font-mono); font-size: 20px; }
  .thze-table th, .thze-table td { border: 1px solid var(--card-border); padding: 8px 14px; text-align: center; }
  .thze-table th { background: var(--paper-2); font-family: var(--font-display); font-size: 13px; }
  .thze-table td.op { border: none; font-weight: 700; }

  .malkreuz-row { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 8px 0; font-family: var(--font-mono); font-size: 17px; flex-wrap: wrap; }
  .digit-boxes { display: inline-flex; gap: 4px; }
  .digit-box {
    width: 38px !important; height: 44px; padding: 0 !important; text-align: center;
    font-family: var(--font-mono); font-size: 22px; font-weight: 700;
    border: 2px solid var(--card-border); border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  .digit-box:focus { outline: none; border-color: var(--gold); }

  .scratch-label { font-size: 12px; color: var(--ink-2); font-weight: 600; margin: 14px 0 4px; }
  .scratch-pad {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 100px;
    font-family: var(--font-mono); font-size: 16px; color: var(--ink); line-height: 22px;
    padding: 8px 12px; border: 2px solid var(--card-border); border-radius: 10px;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 22px 22px; background-position: 12px 8px;
  }
  .scratch-pad:focus { outline: none; border-color: var(--gold); }
  .scratch-pad::placeholder { font-family: var(--font-display); color: var(--ink-2); opacity: .6; }

  .svg-wrap { display: flex; justify-content: center; margin-bottom: 8px; }
  svg text { font-family: var(--font-mono); }

  .mc-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 480px) { .mc-options { grid-template-columns: 1fr; } }
  .mc-btn {
    font-family: var(--font-mono); font-weight: 700; font-size: 15px;
    padding: 12px; border-radius: 12px; border: 2px solid var(--card-border);
    background: var(--paper); cursor: pointer; text-align: center;
  }
  .mc-btn:hover { border-color: var(--gold); }
  .mc-btn.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .mc-btn.wrong { background: var(--error-bg); border-color: var(--error); color: var(--error); }
  .mc-btn:disabled { cursor: default; }

  /* Kopfrechnen */
  .kopf-setup { display: flex; flex-direction: column; gap: 18px; max-width: 480px; margin: 0 auto; }
  .kopf-setup .opt-group label.group-label { font-weight: 700; font-size: 14px; margin-bottom: 8px; display: block; }
  .opt-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt-pills button {
    font-family: var(--font-display); font-weight: 600; font-size: 14px;
    padding: 9px 15px; border-radius: 999px; border: 2px solid var(--card-border);
    background: var(--card); cursor: pointer;
  }
  .opt-pills button.active { background: var(--gold); border-color: var(--gold); color: #fff; }
  .kopf-stage { text-align: center; }
  .kopf-progress { font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); margin-bottom: 10px; }
  .kopf-orb {
    width: 130px; height: 130px; border-radius: 50%; margin: 20px auto;
    display: flex; align-items: center; justify-content: center; font-size: 46px;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold));
    box-shadow: 0 0 0 8px var(--gold-bg);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .kopf-orb.waiting { animation: none; background: radial-gradient(circle at 35% 30%, #cfe8d4, var(--success)); box-shadow: 0 0 0 8px var(--success-bg); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .kopf-bar { height: 10px; border-radius: 6px; background: var(--paper-2); overflow: hidden; max-width: 320px; margin: 14px auto; }
  .kopf-bar > div { height: 100%; background: var(--success); width: 100%; transform-origin: left; }
  .solution-list { text-align: left; max-width: 480px; margin: 0 auto; }
  .solution-list .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--card-border); font-size: 14px; }
  .solution-list .row b { font-family: var(--font-mono); color: var(--gold); }

  footer.attrib { text-align: center; color: var(--ink-2); font-size: 12px; margin-top: 40px; opacity: .6; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="star-badge">★</div>
    <div>
      <h1>Elas Mathearbeit</h1>
      <p>4. Klasse — auf dem Weg zur 1 mit Sternchen</p>
    </div>
    <button id="chaos-toggle" class="chaos-toggle-btn" title="Freche Kommentare bei den Rückmeldungen an/aus">🎭 Chaos-Modus</button>
  </header>

  <nav class="tabs">
    <button data-view="home" class="active">Üben</button>
    <button data-view="kopfrechnen">Kopfrechnen (Audio)</button>
    <button data-view="pruefung">Prüfungssimulation</button>
  </nav>

  <main id="app"></main>

  <footer class="attrib">Selbst gebaut, damit üben Spaß macht. Rechenweg zählt mehr als Tempo.</footer>
</div>

<script src="engine.js"></script>
<script>
(function () {
  "use strict";

  const STORAGE_KEY = "ela_mathearbeit_v1";
  const CHAOS_KEY = "ela_mathearbeit_chaos_v1";
  const SVG_NS = "http://www.w3.org/2000/svg";

  // ---------- Chaos-Modus: freche, selbst ausgedachte Kommentare (kein Zitat, keine Stimm-Imitation) ----------
  let chaosMode = false;
  try { chaosMode = localStorage.getItem(CHAOS_KEY) === "1"; } catch (e) {}
  const CHAOS_CORRECT = [
    "Boom! 💥 Richtig — ich hab schon geklatscht, bevor du fertig warst.",
    "Treffer! Ich wollte gerade 'schwierige Aufgabe' sagen, aber du warst schneller.",
    "Sauber! Mathe-Punkte für dich, Kompliment-Punkte für mich, weil ich sie verteile.",
    "Volltreffer! Selbst mein Algorithmus ist beeindruckt, und der beeindruckt sich sonst nie.",
    "Richtig! Ich flüster's nicht, ich SCHREI's: RICHTIG!",
    "Bingo! Wenn Rechnen eine Sportart wäre, hättest du gerade einen Pokal gewonnen.",
    "Perfekt gelöst. Ich wäre stolz, wenn ich Gefühle hätte. Ich tu jetzt einfach so.",
    "Klick — richtig! Das war so sauber, das schreib ich mir hinter die Ohren. Falls ich welche hätte.",
  ];
  const CHAOS_WRONG = [
    "Autsch. Aber ich hab schon Schlimmeres überlebt — probier's nochmal.",
    "Nope, aber knapp daneben zählt bei mir trotzdem als 'mutig versucht'.",
    "Fast! Naja, nicht wirklich fast, aber ich will nett sein. Nochmal!",
    "Kleiner Ausrutscher. Passiert sogar Rechen-Profis wie... anderen. Nicht mir. Anderen.",
    "Das war nicht die Zahl, auf die ich gehofft hatte. Rechenweg checken, dann klappt's.",
    "Noch nicht ganz — aber Fehler sind nur Übungsrunden mit Umweg.",
    "Knapp verpasst! Zum Glück gibt's hier keine Strafrunden, nur die nächste Aufgabe.",
  ];
  function chaosLine(pool) { return pool[Math.floor(Math.random() * pool.length)]; }
  function feedbackHeadline(correct) {
    if (!chaosMode) return correct ? "✓ Richtig!" : "✗ Noch nicht ganz.";
    return (correct ? "✓ " : "✗ ") + chaosLine(correct ? CHAOS_CORRECT : CHAOS_WRONG);
  }
  const CHAOS_KOPF_INTRO = [
    "Achtung, Ohren auf: gleich wird gerechnet, und ich lese vor, als gäb's morgen keine Mathearbeit mehr.",
    "Los geht's! Ich lese vor, du rechnest, und danach tun wir beide so, als wäre das leicht gewesen.",
    "Kopfrechnen-Zeit! Stift bereit, Kopf an — und keine Sorge, ich rede langsamer als ich denke.",
  ];
  function chaosKopfOutro(mode, correctCount, total) {
    if (mode !== "practice") return chaosLine([
      "Geschafft! Das Papier ist jetzt voller als mein Terminkalender.",
      "Fertig! Ich brauch jetzt eine Pause. Du bestimmt auch.",
      "Das war's — Stift beiseite, Kopf hat genug gerechnet für heute.",
    ]);
    const ratio = correctCount / total;
    if (ratio >= 0.9) return "Fast alles richtig! Ich hab kurz gezweifelt, ob du schummelst — aber nein, das war einfach gut.";
    if (ratio >= 0.7) return "Stark! Ein paar Wackler, aber insgesamt: sauber gerechnet.";
    if (ratio >= 0.5) return "Die Hälfte und mehr — nicht schlecht, aber wir schauen uns die Wackler nochmal an.";
    return "Okay, das war holprig. Kein Drama — nochmal üben, dann sieht's schon anders aus.";
  }
  function chaosPruefungHeadline(correctCount, total) {
    const ratio = correctCount / total;
    if (ratio >= 0.9) return "Respekt. Selbst ich hätte nicht so schnell gerechnet.";
    if (ratio >= 0.7) return "Richtig stark! Ein paar Stellen zum Nachschärfen, sonst top.";
    if (ratio >= 0.5) return "Solide Basis — jetzt die Wackler gezielt angehen.";
    return "Kein Beinbruch. Einmal tief durchatmen, dann nochmal gezielt üben.";
  }

  const CATEGORIES = [
    { id: "stellenwert", group: "Zahlen bis 10 000", title: "Stellenwerttafel", desc: "Zahlen aus T/H/Z/E zusammensetzen und zerlegen", icon: "🔢" },
    { id: "zahlenstrahl", group: "Zahlen bis 10 000", title: "Zahlenstrahl", desc: "Welche Zahl zeigt der Pfeil?", icon: "📍" },
    { id: "zahlenstrahlmitte", group: "Zahlen bis 10 000", title: "Genau in der Mitte", desc: "Die mittlere Zahl zwischen zwei Werten finden", icon: "🎯" },
    { id: "nachbarzahlen", group: "Zahlen bis 10 000", title: "Nachbarzahlen", desc: "Vorgänger, Nachfolger, Nachbarzehner/-hunderter/-tausender", icon: "↔️" },
    { id: "vergleich", group: "Zahlen bis 10 000", title: "Zahlen vergleichen", desc: "Kleiner oder größer? < oder >", icon: "⚖️" },
    { id: "ordnen", group: "Zahlen bis 10 000", title: "Zahlen ordnen", desc: "Der Größe nach ordnen", icon: "📶" },
    { id: "halbschriftlich", group: "Plus und Minus", title: "Halbschriftlich rechnen", desc: "Runde Zahlen im Kopf ergänzen", icon: "➕" },
    { id: "schriftlich", group: "Plus und Minus", title: "Schriftlich rechnen", desc: "Addieren und subtrahieren mit Übertrag", icon: "📝" },
    { id: "ketten", group: "Plus und Minus", title: "Kettenaufgaben", desc: "Mehrschrittige Rechengeschichten", icon: "🔗" },
    { id: "sachaufgabe", group: "Plus und Minus", title: "Sachaufgaben", desc: "Textaufgaben mit Antwortsatz", icon: "⛴️" },
    { id: "groesstekleinste", group: "Plus und Minus", title: "Größtes & kleinstes Ergebnis", desc: "Die richtigen Zahlen auswählen", icon: "🏆" },
    { id: "malkreuz", group: "Mal und Geteilt", title: "Malkreuz", desc: "Halbschriftlich multiplizieren", icon: "✖️" },
    { id: "teilen", group: "Mal und Geteilt", title: "Geteilt mit Rest", desc: "Halbschriftlich dividieren", icon: "➗" },
    { id: "senkrechtparallel", group: "Geometrie", title: "Senkrecht & Parallel", desc: "Geraden zueinander erkennen", icon: "📐", weak: true },
    { id: "rechtewinkel", group: "Geometrie", title: "Rechte Winkel zählen", desc: "Wie viele rechte Winkel hat die Figur?", icon: "◻️", weak: true },
    { id: "parallelezeichnen", group: "Geometrie", title: "Parallele im Abstand", desc: "Parallele Gerade im richtigen Abstand einzeichnen", icon: "〰️", weak: true },
    { id: "streckemessen", group: "Geometrie", title: "Strecken messen", desc: "Länge am Lineal ablesen (cm/mm)", icon: "📏" },
    { id: "streckezeichnen", group: "Geometrie", title: "Strecken zeichnen", desc: "Eine vorgegebene Länge einzeichnen", icon: "✏️" },
    { id: "rechteckzeichnen", group: "Geometrie", title: "Rechteck zeichnen", desc: "Rechteck mit vorgegebenen Maßen", icon: "▭" },
  ];
  const GROUP_ORDER = ["Zahlen bis 10 000", "Plus und Minus", "Mal und Geteilt", "Geometrie"];
  const CAT_BY_ID = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));

  // ---------- Progress store ----------
  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
  }
  let progress = loadProgress();
  function recordResult(catId, correct) {
    if (!progress[catId]) progress[catId] = { attempts: 0, correct: 0, streak: 0 };
    progress[catId].attempts++;
    if (correct) { progress[catId].correct++; progress[catId].streak++; }
    else progress[catId].streak = 0;
    saveProgress(progress);
  }
  function masteryRatio(catId) {
    const p = progress[catId];
    if (!p || p.attempts === 0) return 0;
    return p.correct / p.attempts;
  }
  function isMastered(catId) {
    const p = progress[catId];
    return p && p.attempts >= 3 && masteryRatio(catId) >= 0.8;
  }

  // ---------- DOM helpers ----------
  const app = document.getElementById("app");
  function h(tag, attrs, children) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "html") el.innerHTML = attrs[k];
      else if (k === "class") el.className = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    (children || []).forEach((c) => { if (c) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return el;
  }
  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function fmtNum(n) { return String(n); }

  // Einzelne Ziffern-Kästchen statt eines durchgehenden Zahlenfelds — manche Kinder
  // wollen die letzte Ziffer zuerst eintragen (z.B. bei Divisionsergebnissen), das
  // geht in einem normalen number-Feld schlecht. Jedes Kästchen ist unabhängig
  // befüllbar, Reihenfolge ist egal.
  function digitBoxes(count) {
    const wrap = h("span", { class: "digit-boxes" });
    const inputs = [];
    for (let i = 0; i < count; i++) {
      const inp = h("input", { type: "text", inputmode: "numeric", pattern: "[0-9]", maxlength: "1", class: "digit-box" });
      inp.addEventListener("input", () => {
        inp.value = inp.value.replace(/[^0-9]/g, "").slice(-1);
        if (inp.value && i < count - 1) inputs[i + 1].focus();
      });
      inp.addEventListener("keydown", (ev) => {
        if (ev.key === "Backspace" && !inp.value && i > 0) inputs[i - 1].focus();
      });
      inputs.push(inp);
      wrap.appendChild(inp);
    }
    function getValue() {
      if (inputs.some((inp) => !/^[0-9]$/.test(inp.value))) return NaN;
      return parseInt(inputs.map((inp) => inp.value).join(""), 10);
    }
    return { wrap, inputs, getValue };
  }

  // ---------- Number-line SVG ----------
  function buildNumberLineSVG(min, max, majorStep, minorStep, target, width) {
    width = width || 640;
    const height = 110;
    const pad = 24;
    const svg = svgEl("svg", { width: "100%", viewBox: `0 0 ${width} ${height}`, height });
    const y = 60;
    const scale = (width - 2 * pad) / (max - min);
    const xOf = (v) => pad + (v - min) * scale;
    svg.appendChild(svgEl("line", { x1: pad, y1: y, x2: width - pad, y2: y, stroke: "var(--ink)", "stroke-width": 2 }));
    for (let v = min; v <= max + 1e-9; v += minorStep) {
      const isMajor = Math.round((v - min) / majorStep) * majorStep + min === Math.round(v * 100) / 100 || v % majorStep === 0;
      const tickH = v % majorStep === 0 ? 12 : 6;
      svg.appendChild(svgEl("line", { x1: xOf(v), y1: y - tickH, x2: xOf(v), y2: y + tickH, stroke: "var(--ink-2)", "stroke-width": v % majorStep === 0 ? 2 : 1 }));
      if (v % majorStep === 0) {
        const t = svgEl("text", { x: xOf(v), y: y + 30, "text-anchor": "middle", "font-size": "12", fill: "var(--ink-2)" });
        t.textContent = fmtNum(Math.round(v));
        svg.appendChild(t);
      }
    }
    const tx = xOf(target);
    svg.appendChild(svgEl("line", { x1: tx, y1: y - 16, x2: tx, y2: y + 16, stroke: "var(--gold)", "stroke-width": 3 }));
    const arrow = svgEl("path", { d: `M ${tx - 7} ${y - 30} L ${tx + 7} ${y - 30} L ${tx} ${y - 18} Z`, fill: "var(--gold)" });
    svg.appendChild(arrow);
    return svg;
  }

  function buildRulerSVG(mm, drawnMm) {
    const pxPerMm = 7.2;
    const totalCm = 16;
    const width = totalCm * pxPerMm * 10 + 40;
    const height = 90;
    const svg = svgEl("svg", { width: "100%", viewBox: `0 0 ${width} ${height}`, height });
    const y0 = 40;
    const x0 = 20;
    svg.appendChild(svgEl("rect", { x: x0, y: y0 - 22, width: totalCm * pxPerMm * 10, height: 36, fill: "#fff", stroke: "var(--ink-2)", "stroke-width": 1.5, rx: 4 }));
    for (let i = 0; i <= totalCm * 10; i++) {
      const x = x0 + i * pxPerMm;
      const isCm = i % 10 === 0;
      const isHalf = i % 5 === 0;
      const tickH = isCm ? 16 : isHalf ? 11 : 7;
      svg.appendChild(svgEl("line", { x1: x, y1: y0 - 22, x2: x, y2: y0 - 22 + tickH, stroke: "var(--ink)", "stroke-width": isCm ? 1.4 : 0.8 }));
      if (isCm && i > 0) {
        const t = svgEl("text", { x, y: y0 - 24, "text-anchor": "middle", "font-size": "10", fill: "var(--ink-2)" });
        t.textContent = i / 10;
        svg.appendChild(t);
      }
    }
    if (drawnMm != null) {
      const segX = x0 + drawnMm * pxPerMm;
      svg.appendChild(svgEl("line", { x1: x0, y1: y0 + 22, x2: segX, y2: y0 + 22, stroke: "var(--gold)", "stroke-width": 4 }));
      svg.appendChild(svgEl("line", { x1: x0, y1: y0 + 16, x2: x0, y2: y0 + 28, stroke: "var(--gold)", "stroke-width": 3 }));
      svg.appendChild(svgEl("line", { x1: segX, y1: y0 + 16, x2: segX, y2: y0 + 28, stroke: "var(--gold)", "stroke-width": 3 }));
    }
    return { svg, x0, pxPerMm, y0 };
  }

  function pickBestGermanVoice(voices) {
    const byLang = (lang) => voices.filter((v) => v.lang === lang);
    const rank = (list) =>
      list.find((v) => /google/i.test(v.name)) ||
      list.find((v) => !v.localService) ||
      list.find((v) => /(anna|petra|markus|helena)/i.test(v.name)) ||
      list[0] ||
      null;
    return (
      rank(byLang("de-DE")) ||

      null

      const voices = speechSynthesis.getVoices();
      if (voices.length) {
        germanVoice = pickBestGermanVoice(voices);

      }
    }
    pick();
    if (!voicesReady) {

      setTimeout(pick, 300);

  function speakOne(text, onend) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    if (germanVoice) u.voice = germanVoice;
    u.rate = 0.88;
    u.pitch = 1;
    u.volume = 1;
    u.onend = onend;

    speechSynthesis.speak(u);

  function speak(text, onend) {
    if (typeof speechSynthesis === "undefined") { onend && onend(); return; }
    speechSynthesis.cancel();
    const chunks = text.split(/(?<=[.!?])\s+/).filter(Boolean);
    let i = 0;
    function next() {
      if (i >= chunks.length) { onend && onend(); return; }
      const chunk = chunks[i++];
      speakOne(chunk, () => setTimeout(next, i < chunks.length ? 180 : 0));
    }
    next();
  }

      const orb = h("div", { class: "kopf-orb" }, ["🎭"]);
      card.appendChild(orb);
      speak(chaosLine(CHAOS_KOPF_INTRO), () => playKopfStep(card));
    } else {
      playKopfStep(card);
    }
  }

  const KETTE_STEP_PAUSE_MS = 3500;
  function speakSteps(steps, i, orb, onAllDone) {
    const isLast = i === steps.length - 1;
    const text = i === 0 ? steps[i].clause : `Und jetzt: ${steps[i].clause}`;
    speak(text, () => {
      if (isLast) { onAllDone(); return; }
      orb.textContent = "🤔";
      setTimeout(() => { orb.textContent = "🔊"; speakSteps(steps, i + 1, orb, onAllDone); }, KETTE_STEP_PAUSE_MS);
    });
  }

  function playKopfStep(card) {
    const st = kopfState;
    if (st.index >= st.tasks.length) { renderKopfSummary(card); return; }
    const task = st.tasks[st.index];
    const isKette = task.category === "kopf_kette" && Array.isArray(task.steps) && task.steps.length > 1;
    card.innerHTML = "";
    card.appendChild(h("div", { class: "kopf-progress" }, [`Aufgabe ${st.index + 1} von ${st.tasks.length}`]));
    const orb = h("div", { class: "kopf-orb" }, ["🔊"]);
    card.appendChild(orb);
    const controls = h("div", { class: "btn-row" });
    const repeatBtn = h("button", { class: "btn secondary" }, ["🔁 Wiederholen"]);
    const stopBtn = h("button", { class: "btn secondary" }, ["⏹ Abbrechen"]);
    function playAudio(onAllDone) {
      orb.textContent = "🔊";
      if (isKette) speakSteps(task.steps, 0, orb, onAllDone);
      else speak(task.spoken, onAllDone);
    }
    repeatBtn.addEventListener("click", () => playAudio(() => {}));
    stopBtn.addEventListener("click", () => { stopKopfAudio(); renderKopfSetup(); });
    controls.appendChild(repeatBtn); controls.appendChild(stopBtn);
    card.appendChild(controls);

    let practiceInput = null;
    const practiceSlot = h("div", { id: "practice-slot" });
    card.appendChild(practiceSlot);

    playAudio(() => {
      orb.classList.add("waiting");
      orb.textContent = "✍️";
      if (kopfState.mode === "practice") {
        practiceSlot.innerHTML = "";
        const row = h("div", { class: "input-row" });
        practiceInput = h("input", { type: "number", placeholder: "Antwort" });
        row.appendChild(practiceInput);
        practiceSlot.appendChild(row);
        practiceInput.focus();
      }
      const bar = h("div", { class: "kopf-bar" }, [h("div", {})]);
      card.appendChild(bar);
      const fill = bar.querySelector("div");
      fill.style.transition = `transform ${kopfState.pause}s linear`;
      requestAnimationFrame(() => { fill.style.transform = "scaleX(0)"; });
      const timer = setTimeout(() => {
        const given = practiceInput ? parseInt(practiceInput.value, 10) : null;
        kopfState.results.push({ task, given });
        kopfState.index++;
        playKopfStep(card);
      }, kopfState.pause * 1000);
      kopfState.timers.push(timer);
    });
  }

  function renderKopfSummary(card) {
    const st = kopfState;
    card.innerHTML = "";
    card.appendChild(h("h2", {}, ["Fertig! 🎉"]));
    if (chaosMode) {
      const correctCount = st.mode === "practice" ? st.results.filter((r) => r.given === r.task.answer).length : null;
      card.appendChild(h("p", { style: "font-family:var(--font-hand);font-size:19px;color:var(--ink-2);" }, [chaosKopfOutro(st.mode, correctCount, st.results.length)]));
    }
    if (st.mode === "practice") {
      const correctCount = st.results.filter((r) => r.given === r.task.answer).length;
      card.appendChild(h("p", { style: "font-size:18px;font-weight:700;" }, [`${correctCount} von ${st.results.length} richtig`]));
    } else {
      card.appendChild(h("p", { style: "color:var(--ink-2);" }, ["Lösungsblatt zum Vergleichen mit dem Papier:"]));
    }
    const list = h("div", { class: "solution-list" });
    st.results.forEach((r, i) => {
      const row = h("div", { class: "row" }, [
        h("span", {}, [`${i + 1}. ${r.task.spoken}`]),
        h("b", {}, [String(r.task.answer)]),
      ]);
      list.appendChild(row);
    });
    card.appendChild(list);
    const again = h("button", { class: "btn gold", style: "margin-top:16px;" }, ["Neue Runde"]);
    again.addEventListener("click", renderKopfSetup);
    card.appendChild(again);
  }

  // ---------- Prüfungssimulation ----------
  const WEIGHTED_CATS = [
    "stellenwert", "zahlenstrahl", "zahlenstrahlmitte", "nachbarzahlen", "vergleich", "ordnen",
    "halbschriftlich", "schriftlich", "ketten", "sachaufgabe", "groesstekleinste",
    "malkreuz", "teilen",
    "senkrechtparallel", "senkrechtparallel",
    "rechtewinkel", "rechtewinkel",
    "parallelezeichnen", "parallelezeichnen",
    "streckemessen", "streckezeichnen",
    "rechteckzeichnen",
  ];
  function isDynamicallyWeak(catId) {
    const p = progress[catId];
    return p && p.attempts >= 3 && masteryRatio(catId) < 0.7;
  }
  let pruefungSelectedCats = null;
  let pruefungCount = 20;
  function renderPruefungIntro() {
    if (!pruefungSelectedCats) pruefungSelectedCats = new Set(CATEGORIES.map((c) => c.id));
    app.innerHTML = "";
    const box = h("div", { class: "task-card" });
    box.appendChild(h("h2", {}, ["Prüfungssimulation"]));
    box.appendChild(h("p", { style: "color:var(--ink-2);" }, ["Wähl aus, welche Themen diesmal drankommen sollen — muss nicht jedes Mal alles sein."]));

    const quickRow = h("div", { class: "btn-row", style: "margin-bottom:10px;" });
    const checkboxRefs = [];
    function refreshChecks() {
      checkboxRefs.forEach(({ id, cb }) => (cb.checked = pruefungSelectedCats.has(id)));
    }
    const allBtn = h("button", { class: "btn secondary" }, ["Alle"]);
    allBtn.addEventListener("click", () => { pruefungSelectedCats = new Set(CATEGORIES.map((c) => c.id)); refreshChecks(); });
    const noneBtn = h("button", { class: "btn secondary" }, ["Keine"]);
    noneBtn.addEventListener("click", () => { pruefungSelectedCats = new Set(); refreshChecks(); });
    const weakBtn = h("button", { class: "btn secondary" }, ["Nur Schwächen"]);
    weakBtn.addEventListener("click", () => {
      pruefungSelectedCats = new Set(CATEGORIES.filter((c) => c.weak || isDynamicallyWeak(c.id)).map((c) => c.id));
      refreshChecks();
    });
    quickRow.appendChild(allBtn); quickRow.appendChild(noneBtn); quickRow.appendChild(weakBtn);
    box.appendChild(quickRow);

    GROUP_ORDER.forEach((group) => {
      box.appendChild(h("div", { class: "group-title", style: "margin-top:14px;" }, [group]));
      const grid = h("div", { style: "display:flex;flex-wrap:wrap;gap:8px;" });
      CATEGORIES.filter((c) => c.group === group).forEach((c) => {
        const label = h("label", { style: "display:flex;align-items:center;gap:6px;padding:8px 12px;border:2px solid var(--card-border);border-radius:10px;cursor:pointer;font-size:14px;background:var(--paper);" });
        const cb = h("input", { type: "checkbox" });
        cb.checked = pruefungSelectedCats.has(c.id);
        cb.addEventListener("change", () => { if (cb.checked) pruefungSelectedCats.add(c.id); else pruefungSelectedCats.delete(c.id); });
        checkboxRefs.push({ id: c.id, cb });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(`${c.icon} ${c.title}`));
        if (c.weak) label.appendChild(h("span", { class: "weak-flag", style: "margin-left:2px;" }, ["Übe das!"]));
        grid.appendChild(label);
      });
      box.appendChild(grid);
    });

    box.appendChild(h("div", { class: "group-title", style: "margin-top:16px;" }, ["Anzahl Aufgaben"]));
    const countRow = h("div", { class: "opt-pills" });
    [10, 15, 20, 30].forEach((n) => {
      const btn = h("button", { class: n === pruefungCount ? "active" : "" }, [String(n)]);
      btn.addEventListener("click", () => { pruefungCount = n; [...countRow.children].forEach((c) => c.classList.remove("active")); btn.classList.add("active"); });
      countRow.appendChild(btn);
    });
    box.appendChild(countRow);

    const errSlot = h("div", { class: "explain", style: "color:var(--error);margin-top:10px;" });
    const startBtn = h("button", { class: "btn gold", style: "margin-top:16px;" }, ["Prüfung starten"]);
    startBtn.addEventListener("click", () => {
      if (pruefungSelectedCats.size === 0) { errSlot.textContent = "Wähle mindestens ein Thema aus."; return; }
      startPruefung();
    });
    box.appendChild(errSlot);
    box.appendChild(startBtn);
    app.appendChild(box);
  }
  let pruefungState = null;
  function startPruefung() {
    const basePool = WEIGHTED_CATS.filter((id) => pruefungSelectedCats.has(id));
    const pool = shuffle_((basePool.length ? basePool : [...pruefungSelectedCats]).slice());
    const picks = [];
    for (let i = 0; i < pruefungCount; i++) picks.push(pool[i % pool.length]);
    pruefungState = { items: shuffle_(picks), index: 0, results: [] };
    app.innerHTML = "";
    renderPruefungTask();
  }
  function shuffle_(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function renderPruefungTask() {
    const st = pruefungState;
    app.innerHTML = "";
    app.appendChild(h("div", { class: "kopf-progress", style: "text-align:center;margin-bottom:10px;" }, [`Aufgabe ${st.index + 1} von ${st.items.length}`]));
    const catId = st.items[st.index];
    const task = CATEGORY_GENERATORS[catId]();
    const renderer = RENDERERS[task.category];
    const card = h("div", { class: "task-card" });
    app.appendChild(card);
    const ctx = renderer.render(task, card);
    const feedbackSlot = h("div", {});
    card.appendChild(feedbackSlot);
    const btnRow = h("div", { class: "btn-row" });
    const checkBtn = h("button", { class: "btn gold" }, ["Prüfen"]);
    const nextBtn = h("button", { class: "btn secondary", style: "display:none;" }, [st.index + 1 < st.items.length ? "Weiter →" : "Auswertung ansehen"]);
    checkBtn.addEventListener("click", () => {
      const result = renderer.check(task, ctx);
      const correct = result === true || (result && result.correct);
      feedbackSlot.innerHTML = "";
      feedbackSlot.appendChild(h("div", { class: "feedback " + (correct ? "correct" : "wrong") }, [feedbackHeadline(correct), result.explain ? h("div", { class: "explain", html: result.explain }) : null]));
      st.results.push({ catId, correct });
      recordResult(catId, correct);
      checkBtn.style.display = "none";
      nextBtn.style.display = "inline-block";
    });
    nextBtn.addEventListener("click", () => {
      st.index++;
      if (st.index >= st.items.length) renderPruefungResult();
      else renderPruefungTask();
    });
    btnRow.appendChild(checkBtn); btnRow.appendChild(nextBtn);
    card.appendChild(btnRow);
  }
  function renderPruefungResult() {
    const st = pruefungState;
    app.innerHTML = "";
    const correctCount = st.results.filter((r) => r.correct).length;
    const box = h("div", { class: "task-card" });
    box.appendChild(h("h2", {}, ["Auswertung"]));
    box.appendChild(h("p", { style: "font-size:22px;font-weight:800;" }, [`${correctCount} von ${st.results.length} richtig`]));
    if (chaosMode) box.appendChild(h("p", { style: "font-family:var(--font-hand);font-size:19px;color:var(--ink-2);margin-top:-8px;" }, [chaosPruefungHeadline(correctCount, st.results.length)]));
    const byCat = {};
    st.results.forEach((r) => {
      if (!byCat[r.catId]) byCat[r.catId] = { correct: 0, total: 0 };
      byCat[r.catId].total++;
      if (r.correct) byCat[r.catId].correct++;
    });
    const list = h("div", { class: "solution-list" });
    Object.keys(byCat).forEach((catId) => {
      const b = byCat[catId];
      list.appendChild(h("div", { class: "row" }, [CAT_BY_ID[catId] ? CAT_BY_ID[catId].title : catId, h("b", {}, [`${b.correct}/${b.total}`])]));
    });
    box.appendChild(list);
    const weakest = Object.keys(byCat).sort((a, b) => byCat[a].correct / byCat[a].total - byCat[b].correct / byCat[b].total)[0];
    if (weakest && byCat[weakest].correct / byCat[weakest].total < 1) {
      const btn = h("button", { class: "btn gold", style: "margin-top:14px;" }, [`Schwäche gezielt üben: ${CAT_BY_ID[weakest].title}`]);
      btn.addEventListener("click", () => renderPractice(weakest));
      box.appendChild(btn);
    }
    const again = h("button", { class: "btn secondary", style: "margin-top:10px;margin-left:8px;" }, ["Zurück zur Übersicht"]);
    again.addEventListener("click", renderHome);
    box.appendChild(again);
    app.appendChild(box);
  }

  renderHome();
})();
</script>
</body>
</html>
